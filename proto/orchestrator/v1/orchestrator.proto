syntax = "proto3";

package orchestrator.v1;

option go_package = "github/nallanos/fire2/gen/orchestrator/v1;orchestrator";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service OrchestratorService {
  rpc IngestSandboxEvent(SandboxEvent) returns (google.protobuf.Empty);
  rpc RegisterWorker(WorkerHeartbeat) returns (WorkerRegistration);
  rpc ReportWorkerHeartbeat(WorkerHeartbeat) returns (google.protobuf.Empty);
}

message WorkerHeartbeat {
  string worker_id  = 1;
  string status     = 2;
  string address    = 3;
  int32  port       = 4;
  int32  capacity   = 5;
  int32  cpu_budget = 6;
  int32  mem_budget = 7;
  int32  cpu_usage  = 8;
  int32  mem_usage  = 9;
  int64  fencing_token = 10;
  // inventory_complete distinguishes an empty inventory (the worker hosts no
  // sandbox) from an absent one (the worker did not report any). The
  // orchestrator only reconciles sandboxes when it is true.
  bool   inventory_complete = 11;
  repeated SandboxInventoryItem sandboxes = 12;
}

// SandboxInventoryItem is one sandbox currently hosted by the reporting worker.
message SandboxInventoryItem {
  string sandbox_id = 1;
  // Instance state, same values as SandboxEvent.state.
  string state = 2;
}

message SandboxEvent {
  string id = 1;
  string sandbox_id = 2;
  reserved 3, 6, 7, 8;
  reserved "container_id", "action", "actor_id", "attributes";
  string worker_id = 4;
  // Instance state, matching firecracker-go-sdk's InstanceInfo.State
  // ("Not started" | "Running" | "Paused").
  string state = 5;
  google.protobuf.Timestamp occurred_at = 9;
  // fencing_token identifies the worker incarnation that emitted the event.
  // Events from a superseded incarnation are rejected.
  int64 fencing_token = 10;
}

message WorkerRegistration {
  int64 fencing_token = 1;
}
