syntax = "proto3";

package orchestrator.v1;

option go_package = "github/nallanos/fire2/gen/orchestrator/v1;orchestrator";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service OrchestratorService {
  rpc IngestSandboxEvent(SandboxEvent) returns (google.protobuf.Empty);
  rpc ReportWorkerHeartbeat(WorkerHeartbeat) returns (google.protobuf.Empty);
}

message WorkerHeartbeat {
  string worker_id  = 1;
  string status     = 2;
  string address    = 3;
  int32  port       = 4;
  int32  capacity   = 5;
  int32  cpu_budget = 6;
  int32  mem_budget = 7;
  int32  cpu_usage  = 8;
  int32  mem_usage  = 9;
}

message SandboxEvent {
  string id = 1;
  string sandbox_id = 2;
  reserved 3, 6, 7, 8;
  reserved "container_id", "action", "actor_id", "attributes";
  string worker_id = 4;
  // Instance state, matching firecracker-go-sdk's InstanceInfo.State
  // ("Not started" | "Running" | "Paused").
  string state = 5;
  google.protobuf.Timestamp occurred_at = 9;
}
