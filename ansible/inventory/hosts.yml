---
# Replace ansible_host with your real VM address.
# One worker process runs per host, sized from the machine itself;
# worker_cpu_budget / worker_mem_budget (see roles/fire2_worker/defaults) only
# hold part of a host back.
all:
  children:
    workers:
      hosts:
        worker-vm-1:
          ansible_host: 129.151.255.195
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/ssh-key-worker-1.key
        worker-vm-2:
          ansible_host: 129.151.242.36
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/ssh-key-worker-2.key

    orchestrator:
      hosts:
        # MainDev — currently the only orchestrator host. Add more here to
        # scale the API/gRPC layer horizontally (unlike Postgres, which
        # stays a single manually-managed instance for now).
        maindev:
          ansible_host: 74.235.166.230
          ansible_user: sesa11568
          ansible_ssh_private_key_file: ~/.ssh/ssh-key-maindev.key
