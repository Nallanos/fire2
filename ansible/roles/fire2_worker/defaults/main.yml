---
fire2_user: fire2
fire2_group: fire2
fire2_install_dir: /opt/fire2

# How many worker processes to run on this VM.
# Each instance gets its own systemd unit (fire2-worker@N) and env file
# (worker-N.env) so they can all use port 0 (ephemeral) without colliding.
worker_instances: 1

# 0 = OS-assigned ephemeral port (self-reported via heartbeat). This lets many
# workers share one VM without manual per-worker port assignment. Pin a value
# only if you need a fixed port.
worker_port: 0
worker_heartbeat_interval: 5s
worker_cpu_budget: 4
worker_mem_budget: 3000

# Stable identifier prefix passed as WORKER_ID. The instance number is
# appended automatically (e.g. "myhost-1", "myhost-2") so each process
# registers as a distinct worker row in the DB.
worker_id: "{{ ansible_hostname }}"

# Left empty by default: the worker binary auto-discovers its own Tailscale
# IP at startup (`tailscale ip -4`, see cmd/worker/main.go) and uses it for
# both the advertised address and the gRPC bind host. A static IP here goes
# stale the moment a host is rebuilt or moved to a new provider — that's
# exactly what caused the Oracle-migration crash loop. Only set these if you
# need to override the auto-discovered value for a specific host.
worker_advertised_host: ""
worker_grpc_bind_host: ""

# --- Firecracker ---
# Pinned to a specific published release + its official sha256 so the
# install task is both reproducible and idempotent (get_url skips the
# download whenever the destination already matches this checksum).
firecracker_version: "1.16.1"
firecracker_checksum_x86_64: "sha256:382a02a869e4d6d5cb14c40577f9545e8458021ea8b0b2d3fc10ec14d9c242e6"
firecracker_install_dir: /usr/local/bin

# Golden kernel/rootfs images shared by every sandbox VM on this worker.
# Left empty by default so the role stays a no-op for this part until a
# real object-storage bucket (e.g. DigitalOcean Spaces) is set up and these
# are overridden in group_vars/workers.yml. Runs of the playbook before
# that point simply skip image provisioning instead of failing.
firecracker_kernel_url: ""
firecracker_rootfs_url: ""
firecracker_images_dir: "{{ fire2_install_dir }}/firecracker/images"

# Per-VM working directories (socket + writable rootfs copy) live here, owned
# by fire2. Read by the worker as FIRECRACKER_SANDBOX_DIR; the Go default
# (/tmp) is only meant for local dev.
firecracker_sandbox_dir: "{{ fire2_install_dir }}/firecracker/sandboxes"
