---
# Installs Tailscale so this worker's gRPC listener can bind to a private
# tailnet IP instead of its public interface. Installation is automated;
# joining the tailnet needs a pre-generated authkey (tailscale_authkey — see
# group_vars/all.yml, shared by every host, read from the TAILSCALE_AUTHKEY
# env var). Without
# one, this task installs the client and stops there, requiring a manual
# `tailscale up`. cmd/worker auto-discovers the joined IP at startup, so no
# further config is needed once the host is on the tailnet.

- name: Check whether Tailscale is already installed
  ansible.builtin.command: which tailscale
  register: tailscale_check
  changed_when: false
  failed_when: false

- name: Install Tailscale
  ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
  when: tailscale_check.rc != 0
  args:
    executable: /bin/bash

- name: Join the tailnet with an authkey (skipped if tailscale_authkey unset)
  ansible.builtin.command: >
    tailscale up --authkey={{ tailscale_authkey }}
    --hostname={{ inventory_hostname }} --ssh=false
  when: tailscale_authkey is defined and tailscale_authkey | length > 0
  changed_when: true
  # The authkey is interpolated into the command line — without this,
  # Ansible echoes the full command (secret included) to stdout/logs on
  # every run.
  no_log: true
