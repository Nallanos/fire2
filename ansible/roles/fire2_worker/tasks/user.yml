---
- name: Create fire2 group
  ansible.builtin.group:
    name: "{{ fire2_group }}"
    state: present
    system: true

- name: Create fire2 user
  ansible.builtin.user:
    name: "{{ fire2_user }}"
    group: "{{ fire2_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Add fire2 user to kvm group
  # Required for the worker (running as fire2, not root) to open /dev/kvm
  # when it spawns Firecracker processes.
  ansible.builtin.user:
    name: "{{ fire2_user }}"
    groups: kvm
    append: true
