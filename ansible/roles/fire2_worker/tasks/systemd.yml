---
# Migrate away from the old templated fire2-worker@N instances, found through
# the env files they left behind. They must be gone before fire2-worker
# starts: one worker per host, and two processes on the same sandbox dir
# would reap each other's sandboxes.
- name: Find legacy worker instance env files
  ansible.builtin.find:
    paths: "{{ fire2_install_dir }}"
    patterns: 'worker-[0-9]+\.env'
    use_regex: true
  register: legacy_worker_env_files

- name: Stop and disable legacy fire2-worker instances
  ansible.builtin.systemd:
    name: "fire2-worker@{{ item.path | basename | regex_replace('^worker-(\\d+)\\.env$', '\\1') }}"
    state: stopped
    enabled: false
  loop: "{{ legacy_worker_env_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  failed_when: false

- name: Remove legacy worker instance env files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ legacy_worker_env_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Remove legacy fire2-worker template unit
  ansible.builtin.file:
    path: /etc/systemd/system/fire2-worker@.service
    state: absent
  notify: reload systemd

- name: Deploy systemd unit
  ansible.builtin.template:
    src: fire2-worker.service.j2
    dest: /etc/systemd/system/fire2-worker.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Deploy worker environment file
  ansible.builtin.template:
    src: worker.env.j2
    dest: "{{ fire2_install_dir }}/worker.env"
    # Read by a root process: it names the binaries the worker runs as root.
    owner: root
    group: root
    mode: "0600"
  notify: restart fire2-worker

# Reload before starting: the unit file may be brand new.
- name: Flush handlers before the worker starts heartbeating
  ansible.builtin.meta: flush_handlers

- name: Ensure fire2-worker is started and enabled
  ansible.builtin.systemd:
    name: fire2-worker
    state: started
    enabled: true

# A crash-looping unit reports "changed/ok" at start time, so verify it is
# still healthy once systemd has had time to restart it a few times.
- name: Wait for the worker to settle
  ansible.builtin.pause:
    seconds: 20

- name: Read worker unit state
  ansible.builtin.command: systemctl show -p ActiveState,NRestarts fire2-worker
  register: worker_state
  changed_when: false
  check_mode: false

- name: Assert the worker is active and not restarting
  ansible.builtin.assert:
    that:
      - "'ActiveState=active' in worker_state.stdout_lines"
      - "'NRestarts=0' in worker_state.stdout_lines"
    fail_msg: "fire2-worker is unhealthy: {{ worker_state.stdout_lines }}"
