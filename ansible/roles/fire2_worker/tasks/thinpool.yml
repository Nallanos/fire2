---
# dm-thin pool holding every sandbox's root drive. Instead of copying
# rootfs.ext4 for each sandbox, the image is imported once into the pool as
# a "base" volume and each sandbox gets a snapshot of it: metadata only, a
# few ms, and blocks are allocated only when the guest writes to them.
#
#   /etc/fire2/thinpool.conf        settings shared by the scripts below
#   fire2-thinpool-up + .service    (re)activates the pool at every boot
#   fire2-thinpool-import-base      imports rootfs.ext4 as the base volume
#   fire2-thin + sudoers rule       the one privileged operation the worker
#                                   gets: create/remove a sandbox volume
#   12-fire2-dm-permissions.rules   lets Firecracker (fire2) open them

- name: Install device-mapper tooling
  ansible.builtin.apt:
    name:
      - dmsetup
      - thin-provisioning-tools
      - sudo
    state: present

- name: Create fire2 config directory
  ansible.builtin.file:
    path: /etc/fire2
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy thin pool settings
  # Sourced by fire2-thin, which runs as root: must never be writable by fire2.
  ansible.builtin.template:
    src: thinpool.conf.j2
    dest: /etc/fire2/thinpool.conf
    owner: root
    group: root
    mode: "0644"

- name: Install thin pool scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - fire2-thinpool-up
    - fire2-thinpool-import-base
    - fire2-thin

- name: Deploy fire2-thinpool unit
  ansible.builtin.copy:
    src: fire2-thinpool.service
    dest: /etc/systemd/system/fire2-thinpool.service
    owner: root
    group: root
    mode: "0644"

# Never state: restarted — see the unit. daemon_reload picks up unit changes
# without touching the running pool.
- name: Ensure the thin pool is active and enabled at boot
  ansible.builtin.systemd:
    name: fire2-thinpool
    state: started
    enabled: true
    daemon_reload: true

- name: Import rootfs.ext4 as the pool's base volume
  ansible.builtin.command: /usr/local/sbin/fire2-thinpool-import-base
  register: thinpool_import
  changed_when: thinpool_import.stdout == "imported"
  when: firecracker_rootfs_url | length > 0

- name: Allow the worker to run fire2-thin through sudo
  ansible.builtin.template:
    src: sudoers-fire2-thin.j2
    dest: /etc/sudoers.d/fire2-thin
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Let Firecracker open sandbox volumes
  ansible.builtin.template:
    src: 12-fire2-dm-permissions.rules.j2
    dest: /etc/udev/rules.d/12-fire2-dm-permissions.rules
    owner: root
    group: root
    mode: "0644"
  notify: reload udev rules
