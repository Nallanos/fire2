---
- name: Create victorialogs group
  ansible.builtin.group:
    name: "{{ victorialogs_group }}"
    state: present
    system: true

- name: Create victorialogs user
  ansible.builtin.user:
    name: "{{ victorialogs_user }}"
    group: "{{ victorialogs_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create VictoriaLogs data directory
  ansible.builtin.file:
    path: "{{ victorialogs_data_dir }}"
    state: directory
    owner: "{{ victorialogs_user }}"
    group: "{{ victorialogs_group }}"
    mode: "0750"
