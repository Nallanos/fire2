---
# Required — no default. Set this before running the playbook.
# Orchestrator's Tailscale IP (fire2-api node) — gRPC is insecure, so this
# must be a private tailnet address, never the orchestrator's public IP.
orchestrator_grpc_addr: "100.78.175.35:7001"

# worker_advertised_host / worker_grpc_bind_host are intentionally NOT set
# here — each worker's Tailscale IP is different and the binary
# auto-discovers its own at startup (see defaults/main.yml). Setting a
# single static IP here for the whole group is what caused the crash loop
# after the Oracle migration: it only ever matched one host, and stayed
# wrong forever once that host's IP changed.

# tailscale_authkey moved to group_vars/all.yml — it's shared by every host
# (workers and orchestrator alike), not just this group.
