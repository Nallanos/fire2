---
# Required — no default. Set this before running the playbook.
# Read from the PROD_DATABASE_URL env var (same pattern as
# TAILSCALE_AUTHKEY — put it in your local .env, which is gitignored).
# Never commit a real value: this is the live prod Postgres password.
orchestrator_database_url: "{{ lookup('env', 'PROD_DATABASE_URL') }}"

# Vector (roles/fire2_vector) ships these units' journald output. No sandbox
# directories here, so vector_sandbox_dir stays empty (no file source).
vector_journald_units:
  - fire2-api.service
  - fire2-victorialogs.service
vector_sandbox_dir: ""
# VictoriaLogs is on this host: a memory buffer is enough and spares the
# short disk the 256 MiB minimum of a disk buffer.
vector_buffer_type: memory
